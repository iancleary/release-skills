# Release workflow: https://github.com/iancleary/release-skills
[release]
runner_protocol = "prepared-v1"
name = "example-semver-crate"
version_source = "Cargo.toml"
runner = [
  "uv", "run", "scripts/release.py", "cargo-release",
  "--provider", "github",
  "--version-source", "Cargo.toml",
  "--version-target", "Cargo.toml",
  "--lockfile", "Cargo.lock",
  "--tag-prefix", "v",
  "--branch", "main",
]
dry_run_args = ["--dry-run"]
current_version_command = [
  "uv", "run", "scripts/release.py", "cargo-current-version",
  "--version-source", "Cargo.toml",
]
publish = true

[checks]
commands = [
  ["cargo", "build", "--locked", "--verbose"],
  ["cargo", "test", "--locked", "--verbose"],
]
